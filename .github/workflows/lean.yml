name: Lean

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: lean-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Build
        run: lake build
      - name: Explore API
        run: lake env lean Explore.lean
      - name: Reject placeholders
        run: |
          if grep -R -n -E '\\b(sorry|admit|native_decide)\\b' GreedyUniformity GreedyUniformity.lean; then
            echo "Forbidden Lean placeholder found"
            exit 1
          fi
      - name: Python tests
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q
