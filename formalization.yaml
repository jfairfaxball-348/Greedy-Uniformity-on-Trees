related_formalizations: []

status:
  scope: >-
    The submission package comprises exactly two final Theorem A declarations
    and seven final Theorem B checkpoints. Theorem A classifies exact
    greedy-law uniformity, and equivalently zero bias, for finite nonempty
    trees as precisely K1 or K2. Theorem B treats the explicit mixed-spider
    family: the maximal-independent-set count, exact centre and non-centre
    probabilities, the tuned exact bias identity and positivity, and the two
    stated asymptotic upper bounds. It does not formalize or claim a matching
    lower bound, global extremality, an all-n optimum, or worldwide priority.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

