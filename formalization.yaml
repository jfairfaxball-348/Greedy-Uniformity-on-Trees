version: "v0.4"

project:
  name: "Greedy Uniformity on Trees"
  description: >-
    Formalization of exact distributional results for the random-permutation
    greedy maximal-independent-set process on finite trees. For every finite
    nonempty tree, the complete greedy output law is uniform over maximal
    independent sets exactly for K1 and K2. For the mixed-spider family
    T_{k,l}, the development counts maximal independent sets, proves exact
    output probabilities, and for l=2^k-k proves positive total-variation bias
    with decay O(sqrt(k)/4^k), equivalently O(sqrt(log n_k)/n_k^2) along
    n_k=2^k+k+1. The Stage-4 novelty classification is "plausibly new with
    bounded uncertainty"; no worldwide-priority, global-optimality, matching
    lower-bound, all-n extremal, or other stronger claim is made.
  authors:
    - name: "John Fairfax-Ball"
      github: "jfairfaxball-348"
  license: "Apache-2.0"
  responsible_maintainers:
    - name: "John Fairfax-Ball"
      github: "jfairfaxball-348"

classification:
  arxiv: ["math.CO", "math.PR"]
  msc2020: ["05C05", "05C69"]

