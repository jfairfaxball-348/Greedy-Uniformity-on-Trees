fidelity:
  divergences: >-
    No known divergence in the frozen theorem statements. The Lean development
    uses the exact finite permutation model; the informal proof may also use
    equivalent random-priority language for exposition. Comparator lists
    GreedyUniformity.mixedSpiderNoncenterSet in definition_names because the
    separately compiled Mathlib-only Challenge and proof-development Solution
    elaborate that one definition to non-identical bodies even though the
    Challenge states the intended finite-set definition and the Solution uses
    the corresponding proof-development definition. Palomar therefore checks
    its type, safety and Solution-side axiom use rather than body identity; all
    nine theorem declarations remain compared by statement.

